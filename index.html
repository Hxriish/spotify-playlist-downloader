<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spotify Playlist Downloader</title>
</head>
<body>
  <h1>Spotify Playlist Downloader</h1>

  <!-- ✅ Clean Mode Toggle Button -->
  <button onclick="toggleCleanMode()" id="cleanModeBtn">Clean Mode: OFF</button>
  <br><br>

  <input type="text" id="playlistURL" placeholder="Enter Spotify Playlist URL" style="width: 400px;" />
  <button onclick="getPlaylist()">Download Playlist as MP3 ZIP</button>

  <pre id="output"></pre>

  <script src="app.js"></script>
</body>
</html>
